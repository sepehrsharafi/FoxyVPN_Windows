name: Build

# Every push builds Windows only (installer, portable zip, and
# the Flutter tests). Android (APK) and macOS (disk image) build only from Actions > Build > Run workflow, which builds
# them on demand; untick a system there to skip it. (macos-port is the macOS work in progress.)

on:
  push:
    branches: [main, macos-port]
  workflow_dispatch:
    inputs:
      android:
        description: Build the Android APK
        type: boolean
        default: true
      windows:
        description: Build Windows (and run the Flutter tests)
        type: boolean
        default: true
      macos:
        description: Build macOS
        type: boolean
        default: true

env:
  # Pinned third-party binaries (checksums computed from the official downloads).
  TUN2SOCKS_VERSION: v2.7.0
  TUN2SOCKS_ZIP_SHA256: c5d46e9452f6c9cc7c15ab9158d6d6a0169ceecd6bca019ce476b49337d2be43
  TUN2SOCKS_LICENSE_SHA256: 796abbf6d0258a01321f88f72c1d712417acdd75342510f0796f7c567b6f05e5
  WINTUN_ZIP_SHA256: 07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51
  TUN2SOCKS_DARWIN_ARM64_ZIP_SHA256: 7c5ebfe2ffb60ecf6e958cc5bbf3e06e74b8b33575ffbb4ba4f6f785a647f1ad
  TUN2SOCKS_DARWIN_AMD64_ZIP_SHA256: 6e654da8bab9ca1645862f0e251a69980e0966680713011feea7b1e5901b2a95
  # Inno Setup, installed with Chocolatey only if the runner does not have ISCC.exe.
  INNO_SETUP_VERSION: 6.5.4

jobs:
  # Lints on a cheap Linux runner first: a lint slip fails here in about a minute
  # instead of after a Windows runner (billed at twice the Linux rate) has started.
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze

  windows:
    needs: analyze
    if: github.event_name == 'push' || inputs.windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test
      - name: Build the app
        shell: bash
        env:
          FOXY_RELAY_URL: ${{ secrets.FOXY_RELAY_URL }}
        run: flutter build windows --release --dart-define=FOXY_RELAY_URL="$FOXY_RELAY_URL"

      - name: Add tun2socks and Wintun next to foxyvpn.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = 'build/windows/x64/runner/Release'
          $dl = Join-Path $env:RUNNER_TEMP 'fxdl'
          New-Item -ItemType Directory -Force $dl | Out-Null

          function Get-Verified($url, $file, $sha256) {
            Invoke-WebRequest $url -OutFile $file
            $actual = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $sha256) { throw "Checksum mismatch for ${url}: $actual" }
          }

          # tun2socks (MIT) - https://github.com/xjasonlyu/tun2socks
          $base = "https://github.com/xjasonlyu/tun2socks"
          Get-Verified "$base/releases/download/$env:TUN2SOCKS_VERSION/tun2socks-windows-amd64.zip" "$dl/tun2socks.zip" $env:TUN2SOCKS_ZIP_SHA256
          Get-Verified "https://raw.githubusercontent.com/xjasonlyu/tun2socks/$env:TUN2SOCKS_VERSION/LICENSE" "$dl/LICENSE-tun2socks.txt" $env:TUN2SOCKS_LICENSE_SHA256
          Expand-Archive "$dl/tun2socks.zip" "$dl/tun2socks"
          Copy-Item "$dl/tun2socks/tun2socks-windows-amd64.exe" "$release/tun2socks.exe"

          # Wintun driver DLL - https://www.wintun.net
          Get-Verified "https://www.wintun.net/builds/wintun-0.14.1.zip" "$dl/wintun.zip" $env:WINTUN_ZIP_SHA256
          Expand-Archive "$dl/wintun.zip" "$dl/wintun"
          Copy-Item "$dl/wintun/wintun/bin/amd64/wintun.dll" "$release/wintun.dll"

          # Licenses
          New-Item -ItemType Directory -Force "$release/licenses" | Out-Null
          Copy-Item "$dl/LICENSE-tun2socks.txt" "$release/licenses/tun2socks-LICENSE.txt"
          Copy-Item "$dl/wintun/wintun/LICENSE.txt" "$release/licenses/wintun-LICENSE.txt"
          Copy-Item LICENSE "$release/licenses/FoxyVPN-LICENSE.txt"

          foreach ($f in 'foxyvpn.exe', 'tun2socks.exe', 'wintun.dll') {
            if (-not (Test-Path "$release/$f")) { throw "$f is missing from the release folder" }
          }

      # The Visual C++ runtime goes next to foxyvpn.exe (app-local deployment, which
      # Microsoft allows for these files), so nothing has to be installed system-wide.
      # The DLLs come from the Visual Studio on this runner.
      - name: Add the app-local Visual C++ runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = (Resolve-Path 'build/windows/x64/runner/Release').Path

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found at $vswhere" }
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vs) { throw 'No Visual Studio with the C++ x64 tools found' }
          $vs = "$vs".Trim()
          Write-Host "Visual Studio: $vs"

          # VC\Redist\MSVC\<version>\x64\Microsoft.VC143.CRT (newest version, release CRT only)
          $crt = Get-ChildItem -Path (Join-Path $vs 'VC\Redist\MSVC') -Directory |
            ForEach-Object {
              $d = Join-Path $_.FullName 'x64'
              if (Test-Path $d) { Get-ChildItem -Path $d -Directory -Filter 'Microsoft.VC*.CRT' }
            } |
            Where-Object { $_.Parent.Parent.Name -match '^\d+\.\d+' } |
            Sort-Object { [version]($_.Parent.Parent.Name -replace '[^0-9.]', '') } -Descending |
            Select-Object -First 1
          if (-not $crt) { throw "No Microsoft.VC*.CRT redist folder found under $vs\VC\Redist\MSVC" }
          Write-Host "Redist folder: $($crt.FullName)"

          $required = 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll'
          foreach ($f in $required) {
            $src = Join-Path $crt.FullName $f
            if (-not (Test-Path $src)) { throw "$f is missing from $($crt.FullName)" }
            Copy-Item $src $release
          }

          # Any other VC runtime DLL that something in the release folder imports
          # (checked with dumpbin) must be there too: fail now instead of on a user's PC.
          $dumpbin = Get-ChildItem -Path (Join-Path $vs 'VC\Tools\MSVC') -Directory |
            ForEach-Object { Join-Path $_.FullName 'bin\Hostx64\x64\dumpbin.exe' } |
            Where-Object { Test-Path $_ } | Select-Object -Last 1
          if (-not $dumpbin) { throw 'dumpbin.exe not found, cannot check the runtime dependencies' }
          $crtPattern = '^(msvcp|vcruntime|concrt|vcomp|vccorlib|mfc)\d+\w*\.dll$'
          $missing = @()
          foreach ($bin in Get-ChildItem -Path $release -File | Where-Object { $_.Extension -in '.exe', '.dll' }) {
            $deps = & $dumpbin /nologo /dependents $bin.FullName
            if ($LASTEXITCODE -ne 0) { throw "dumpbin failed for $($bin.Name)" }
            foreach ($line in $deps) {
              $name = "$line".Trim()
              if ($name -match $crtPattern -and -not (Test-Path (Join-Path $release $name))) {
                $src = Join-Path $crt.FullName $name
                if (Test-Path $src) { Copy-Item $src $release; Write-Host "Also copied $name (needed by $($bin.Name))" }
                else { $missing += "$name (needed by $($bin.Name))" }
              }
            }
          }
          if ($missing.Count -gt 0) { throw "Runtime DLLs needed but not available: $($missing -join ', ')" }

          # License note for the redistributed DLLs.
          $ver = (Get-Item (Join-Path $release 'vcruntime140.dll')).VersionInfo.ProductVersion
          $note = @"
          Microsoft Visual C++ runtime (app-local copy)

          msvcp140.dll, vcruntime140.dll and vcruntime140_1.dll (version $ver) next to foxyvpn.exe
          are the Microsoft Visual C++ runtime. They are copied unchanged from Microsoft Visual
          Studio's redistributable folder (VC\Redist\MSVC\...\x64\Microsoft.VC*.CRT) and are
          distributed with this application under the "Distributable Code" terms of the
          Microsoft Visual Studio license, which allows deploying them app-local:
          https://learn.microsoft.com/en-us/cpp/windows/determining-which-dlls-to-redistribute
          https://visualstudio.microsoft.com/license-terms/

          They are used only by FoxyVPN. Nothing is installed system-wide.
          "@
          $note = ($note -split "`r?`n" | ForEach-Object { $_.TrimStart() }) -join "`r`n"
          New-Item -ItemType Directory -Force "$release/licenses" | Out-Null
          Set-Content -Path "$release/licenses/Microsoft-VC-Runtime-NOTICE.txt" -Value $note -Encoding utf8

          foreach ($f in $required) {
            if (-not (Test-Path (Join-Path $release $f))) { throw "$f is missing from the release folder" }
          }

      # The portable copy: the same folder as one zip (kept outside the folder so it is not zipped into itself).
      - name: Zip the portable copy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath dist/FoxyVPN-Windows-portable.zip

      - name: Build the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # The pubspec version, without the +build part: 0.1.0+1 -> 0.1.0
          $line = Select-String -Path pubspec.yaml -Pattern '^version:' | Select-Object -First 1
          if (-not $line -or -not ($line.Line -match '^version:\s*(\d+\.\d+\.\d+)(\+\S*)?\s*$')) {
            throw "Cannot read a x.y.z version from pubspec.yaml (found: $($line.Line))"
          }
          $version = $Matches[1]
          Write-Host "Version: $version"
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          # ISCC.exe: use the one on the runner, else install the pinned Inno Setup.
          function Find-Iscc {
            foreach ($dir in ${env:ProgramFiles(x86)}, $env:ProgramFiles) {
              $p = Join-Path $dir 'Inno Setup 6\ISCC.exe'
              if (Test-Path $p) { return $p }
            }
            $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($cmd) { return $cmd.Source }
            return $null
          }
          $iscc = Find-Iscc
          if (-not $iscc) {
            choco install innosetup --version=$env:INNO_SETUP_VERSION -y --no-progress
            if ($LASTEXITCODE -ne 0) {
              # The pinned version is gone from the feed (or the install failed): take the current one.
              Write-Host "::warning::choco could not install Inno Setup $env:INNO_SETUP_VERSION (exit $LASTEXITCODE); falling back to the latest version"
              choco install innosetup -y --no-progress
              if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed ($LASTEXITCODE)" }
            }
            $iscc = Find-Iscc
          }
          if (-not $iscc) { throw 'ISCC.exe not found' }
          Write-Host "ISCC: $iscc"

          & $iscc "/DAppVersion=$version" installer/foxyvpn.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }

          $setup = "dist/FoxyVPN-Setup-$version.exe"
          if (-not (Test-Path $setup)) { throw "$setup was not produced" }
          Write-Host ("{0}: {1:N1} MB" -f $setup, ((Get-Item $setup).Length / 1MB))

      # Install it silently, look at the result, uninstall it silently. The uninstaller runs
      # foxyvpn.exe --cleanup first, so this also proves that entry point returns instead of hanging.
      - name: Test install and uninstall
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Resolve-Path "dist/FoxyVPN-Setup-$env:APP_VERSION.exe").Path
          $dir = Join-Path $env:RUNNER_TEMP 'FoxyVPN-test-install'
          $log = Join-Path $env:RUNNER_TEMP 'foxyvpn-setup.log'

          $p = Start-Process $setup -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$dir`" /LOG=`"$log`"" -PassThru
          $null = $p.Handle  # keep a handle: without it $p.ExitCode is empty once the process is gone
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw 'Setup did not finish within 3 minutes' }
          if ($p.ExitCode -ne 0) { Get-Content $log -ErrorAction SilentlyContinue | Select-Object -Last 40; throw "Setup failed ($($p.ExitCode))" }

          foreach ($f in 'foxyvpn.exe', 'flutter_windows.dll', 'tun2socks.exe', 'wintun.dll', 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll', 'data\app.so', 'licenses\wintun-LICENSE.txt') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "Installed folder is missing $f" }
          }

          $un = Join-Path $dir 'unins000.exe'
          if (-not (Test-Path $un)) { throw 'unins000.exe is missing' }
          $p = Start-Process $un -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -PassThru
          $null = $p.Handle
          $p.WaitForExit(300000) | Out-Null
          # The uninstaller may hand over to a copy of itself and exit early: wait for the folder to go.
          $deadline = (Get-Date).AddMinutes(5)
          while ((Test-Path $dir) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          if (Test-Path $dir) {
            Get-Process foxyvpn -ErrorAction SilentlyContinue | Stop-Process -Force
            throw 'Uninstall did not finish within 5 minutes (does foxyvpn.exe --cleanup return?)'
          }
          if ($p.HasExited -and $p.ExitCode -ne 0) { throw "Uninstall failed ($($p.ExitCode))" }
          if (Test-Path (Join-Path $env:ProgramData 'FoxyVPN')) { throw '%ProgramData%\FoxyVPN is still there after uninstall' }

      - name: Collect the downloads
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist/release | Out-Null
          Copy-Item "dist/FoxyVPN-Setup-$env:APP_VERSION.exe" dist/release/FoxyVPN-Setup.exe
          Copy-Item dist/FoxyVPN-Windows-portable.zip dist/release/

      - uses: actions/upload-artifact@v7
        with:
          name: FoxyVPN-Windows
          path: dist/release/*
          if-no-files-found: error
          retention-days: 90 # the longest GitHub keeps them (public repo); each push makes fresh ones

  android:
    needs: analyze
    if: github.event_name == 'workflow_dispatch' && inputs.android
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - run: flutter pub get

      # Optional: sign with your release key, from four repository secrets (see
      # docs/android.md). Without them every build gets a new throwaway debug key, so a
      # newer APK can't be installed over an older one without uninstalling it first.
      - name: Release signing key
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build the app
        shell: bash
        env:
          FOXY_RELAY_URL: ${{ secrets.FOXY_RELAY_URL }}
        run: flutter build apk --release --dart-define=FOXY_RELAY_URL="$FOXY_RELAY_URL"

      - name: Collect the download
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/FoxyVPN-Android.apk

      - uses: actions/upload-artifact@v7
        with:
          name: FoxyVPN-Android
          path: dist/FoxyVPN-Android.apk
          if-no-files-found: error
          retention-days: 90 # the longest GitHub keeps them (public repo); each push makes fresh ones

  macos:
    needs: analyze
    if: github.event_name == 'workflow_dispatch' && inputs.macos
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      # The network helper (macos_helper/) is a Go program with no dependencies.
      - uses: actions/setup-go@v6
        with:
          go-version: '1.22'
          cache: false

      - run: flutter pub get

      - name: Build the app
        shell: bash
        env:
          FOXY_RELAY_URL: ${{ secrets.FOXY_RELAY_URL }}
        run: |
          set -euo pipefail
          flutter build macos --release --dart-define=FOXY_RELAY_URL="$FOXY_RELAY_URL"
          APP="$PWD/build/macos/Build/Products/Release/FoxyVPN.app"
          if [ ! -x "$APP/Contents/MacOS/FoxyVPN" ]; then
            echo "::error::FoxyVPN.app was not produced at $APP"
            ls -la build/macos/Build/Products/Release || true
            exit 1
          fi
          echo "APP=$APP" >> "$GITHUB_ENV"

      # The helper and tun2socks (MIT, https://github.com/xjasonlyu/tun2socks) go inside the
      # app, in Contents/Resources/helper. Both are universal (Apple Silicon and Intel).
      - name: Add the network helper and tun2socks to the app
        shell: bash
        run: |
          set -euo pipefail
          dl="$RUNNER_TEMP/fxdl"
          rm -rf "$dl"
          mkdir -p "$dl/arm64" "$dl/amd64" "$dl/helper"

          get_verified() { # url file sha256
            curl -fsSL --retry 3 -o "$2" "$1"
            actual="$(shasum -a 256 "$2" | awk '{print $1}')"
            if [ "$actual" != "$3" ]; then
              echo "::error::Checksum mismatch for $1: $actual"
              exit 1
            fi
          }

          base="https://github.com/xjasonlyu/tun2socks/releases/download/$TUN2SOCKS_VERSION"
          get_verified "$base/tun2socks-darwin-arm64.zip" "$dl/arm64.zip" "$TUN2SOCKS_DARWIN_ARM64_ZIP_SHA256"
          get_verified "$base/tun2socks-darwin-amd64.zip" "$dl/amd64.zip" "$TUN2SOCKS_DARWIN_AMD64_ZIP_SHA256"
          get_verified "https://raw.githubusercontent.com/xjasonlyu/tun2socks/$TUN2SOCKS_VERSION/LICENSE" "$dl/LICENSE-tun2socks.txt" "$TUN2SOCKS_LICENSE_SHA256"
          unzip -q "$dl/arm64.zip" -d "$dl/arm64"
          unzip -q "$dl/amd64.zip" -d "$dl/amd64"
          lipo -create "$dl/arm64/tun2socks-darwin-arm64" "$dl/amd64/tun2socks-darwin-amd64" -output "$dl/helper/tun2socks"
          # lipo drops the signature, and Apple Silicon refuses to run unsigned code.
          codesign --force --sign - "$dl/helper/tun2socks"

          bash macos_helper/build.sh "$dl/built"
          cp "$dl/built/foxyvpn-helper" "$dl/helper/foxyvpn-helper"
          cp macos_helper/install.sh macos_helper/uninstall.sh macos_helper/com.foxyvpn.helper.plist "$dl/helper/"
          cp "$dl/LICENSE-tun2socks.txt" "$dl/helper/LICENSE-tun2socks.txt"

          dest="$APP/Contents/Resources/helper"
          mkdir -p "$dest"
          cp -X "$dl/helper/"* "$dest/"
          chmod 755 "$dest/foxyvpn-helper" "$dest/tun2socks" "$dest/install.sh" "$dest/uninstall.sh"
          chmod 644 "$dest/com.foxyvpn.helper.plist" "$dest/LICENSE-tun2socks.txt"
          ls -la "$dest"

      # Ad-hoc signature (no Apple developer account): the whole bundle gets one, so
      # macOS sees an app that has not been changed since it was built.
      - name: Sign the app ad hoc and check it
        shell: bash
        run: |
          set -euo pipefail
          xattr -cr "$APP"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          need_universal() {
            archs="$(lipo -archs "$1")"
            echo "$1: $archs"
            case " $archs " in *" arm64 "*) ;; *) echo "::error::$1 has no arm64 slice"; exit 1 ;; esac
            case " $archs " in *" x86_64 "*) ;; *) echo "::error::$1 has no x86_64 slice"; exit 1 ;; esac
          }
          need_universal "$APP/Contents/MacOS/FoxyVPN"
          need_universal "$APP/Contents/Resources/helper/foxyvpn-helper"
          need_universal "$APP/Contents/Resources/helper/tun2socks"

      # Start the app for a while: it must stay up (a crash at launch would show here).
      - name: Launch test
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/foxyvpn-launch.log"
          "$APP/Contents/MacOS/FoxyVPN" > "$log" 2>&1 &
          pid=$!
          sleep 15
          alive=1
          kill -0 "$pid" 2>/dev/null || alive=0
          echo "--- stdout/stderr of the app ---"
          tail -n 40 "$log" || true
          appLog="$HOME/Library/Application Support/FoxyVPN/log.txt"
          if [ -f "$appLog" ]; then
            echo "--- $appLog ---"
            tail -n 40 "$appLog" || true
          fi
          if [ "$alive" = 1 ]; then
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          else
            echo "::error::FoxyVPN exited within 15 seconds of starting"
            exit 1
          fi

      # Installs the helper for real (root), runs a tunnel through a fake SOCKS5 server
      # and checks traffic, DNS, teardown and uninstall. Needs Go (PATH is kept through sudo).
      - name: Helper and tunnel test
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/smoke.log"
          if ! sudo env "PATH=$PATH" bash macos_helper/ci/smoke.sh "$APP" 2>&1 | tee "$log"; then
            # The end of the log as annotations too: those are readable without
            # signing in to GitHub (step logs are not).
            tail -n 160 "$log" | split -l 40 - "$RUNNER_TEMP/smoke-part-"
            for part in "$RUNNER_TEMP"/smoke-part-*; do
              msg="$(sed -e 's/%/%25/g' -e 's/\r/%0D/g' "$part" | awk 'BEGIN{ORS="%0A"} {print}')"
              echo "::error title=smoke test::$msg"
            done
            exit 1
          fi

      - name: Build the disk image
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/dmg-stage"
          rm -rf "$stage"
          mkdir -p "$stage" dist
          # The smoke test put a test client into the bundle for a while: the
          # shipped app must be exactly what was signed.
          test ! -e "$APP/Contents/MacOS/foxyvpn-smoke-client"
          codesign --verify --deep --strict "$APP"
          ditto "$APP" "$stage/FoxyVPN.app"
          ln -s /Applications "$stage/Applications"
          cat > "$stage/Read me first.txt" <<'EOF'
          FoxyVPN for macOS

          1. Drag FoxyVPN into the Applications folder, then open it from there.

          2. The first time, macOS may say it cannot verify FoxyVPN. That is because the
             app is not notarised by Apple. To allow it once:
             - macOS 15 or newer: try to open FoxyVPN, close the message, then open
               System Settings > Privacy & Security, scroll down and click "Open Anyway"
               next to FoxyVPN.
             - macOS 14 or older: right-click FoxyVPN, choose Open, then Open again.
             - Or in Terminal: xattr -dr com.apple.quarantine /Applications/FoxyVPN.app

          3. The first time you connect, FoxyVPN asks for your Mac password once, to install
             its small network helper. macOS may then show "Background item added": that is
             the helper. Sign in with your Firefox account, pick a location and connect.

          Uninstall: quit FoxyVPN (menu bar icon > Quit FoxyVPN) and drag it to the Trash.
          The helper removes itself within a few hours. To remove it at once, run this in
          Terminal before you delete the app:

            sudo "/Applications/FoxyVPN.app/Contents/Resources/helper/uninstall.sh"
          EOF
          hdiutil create -volname FoxyVPN -srcfolder "$stage" -ov -format UDZO dist/FoxyVPN-macOS.dmg
          hdiutil verify dist/FoxyVPN-macOS.dmg
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: FoxyVPN-macOS
          path: dist/FoxyVPN-macOS.dmg
          if-no-files-found: error
          retention-days: 90 # the longest GitHub keeps them (public repo); each push makes fresh ones
