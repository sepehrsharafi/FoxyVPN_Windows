name: Android test build

# Test builds: a push to a probe/... branch builds only the Android APK (no
# Windows build, no installer). The APK is this run's artifact. Same steps as
# the android job in build.yml.

on:
  push:
    branches: ['probe/**']
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - run: flutter pub get

      # Same release key as build.yml when the secrets exist, so the test APK
      # installs over the normal one.
      - name: Release signing key
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - run: flutter build apk --release

      - name: Collect the download
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/FoxyVPN-Android-test.apk

      - uses: actions/upload-artifact@v7
        with:
          name: FoxyVPN-Android-test
          path: dist/FoxyVPN-Android-test.apk
          if-no-files-found: error
          retention-days: 14
