include: package:flutter_lints/flutter.yaml

# The code is wrapped at about 100-120 columns. At the default 80, format-on-save
# splits one-line `if (x) return;` statements across lines, which
# curly_braces_in_flow_control_structures then reports and CI fails.
formatter:
  page_width: 120

analyzer:
  exclude:
    - build/**
    - windows/**
    - android/**
