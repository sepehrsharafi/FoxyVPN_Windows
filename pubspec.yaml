name: foxyvpn
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  country_flags: ^4.1.2 # SVG flags (MIT); pure Dart renderer, works on Windows
  crypto: ^3.0.7
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  http2: ^3.1.0
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image: ^4.12.0

# http2 3.1.0 with a larger, receipt-credited connection flow-control window
# (see third_party/http2/PATCHES.md).
dependency_overrides:
  http2:
    path: third_party/http2

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/urbanist/OFL.txt

  # Urbanist (SIL OFL 1.1, https://github.com/coreyhu/Urbanist). Static cuts only:
  # nothing below Medium is used anywhere in the app.
  fonts:
    - family: Urbanist
      fonts:
        - asset: assets/fonts/urbanist/Urbanist-Medium.ttf
          weight: 500
        - asset: assets/fonts/urbanist/Urbanist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/urbanist/Urbanist-Bold.ttf
          weight: 700
        - asset: assets/fonts/urbanist/Urbanist-ExtraBold.ttf
          weight: 800
